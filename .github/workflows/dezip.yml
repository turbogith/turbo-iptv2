name: Dezipper le code
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dezipper et ranger
        run: |
          echo "=== fichiers a la racine ==="
          ls -la
          ZIP=$(ls *.zip | head -n 1)
          echo "ZIP trouve : $ZIP"
          rm -rf /tmp/code && mkdir -p /tmp/code
          unzip -o "$ZIP" -d /tmp/code
          echo "=== contenu deballe ==="
          ls /tmp/code
          TOP=$(ls /tmp/code | head -n 1)
          echo "Dossier : $TOP"
          cp -r "/tmp/code/$TOP/." .
          rm -f "$ZIP"
      - name: Commit du code
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "TURBO IPTV source" || echo "rien a commiter"
          git push
