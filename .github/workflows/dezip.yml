name: Dezipper le code
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dezipper et ranger
        run: |
          echo "=== contenu du depot ==="
          ls -la
          ZIP=$(find . -maxdepth 3 -name "*.zip" -not -path "./.git/*" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERREUR : aucun .zip trouve. Verifie qu'il est bien uploade dans l'onglet Code."
            exit 1
          fi
          echo "ZIP trouve : $ZIP"
          rm -rf /tmp/code && mkdir -p /tmp/code
          unzip -o "$ZIP" -d /tmp/code
          TOP=$(ls /tmp/code | head -n 1)
          echo "Dossier : $TOP"
          cp -r "/tmp/code/$TOP/." .
          rm -f "$ZIP"
          echo "=== termine ==="
          ls | head -30
      - name: Commit du code
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git status --short | head -20
          git add -A
          git commit -m "TURBO IPTV source" || echo "rien a commiter"
          git push
